.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}

.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

.iso-dots[data-tone="lo"] circle{opacity:.22}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(720px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Figs 3–5: the same retint as Figs 1–2 (paper faces, navy lines, cool shading). The rovers' black

   besides the apricot signal, which marks only what the robot is sensing. */
.iso[data-theme="light"] .rv-figure,
.iso[data-theme="light"].rv-figure,
.rv-figure {
  --anatomy-paper: #f5f8fb;
  --anatomy-face: #ffffff;
  --anatomy-top: #fbfcfe;
  --anatomy-shade-0: #d6dfea;

  --anatomy-shade-2: #e9eef5;
  --anatomy-shade-3: #f1f5f9;
  --anatomy-lit-top: #ffffff;
  --anatomy-lit-shade: #eaf0f6;
  --anatomy-hi: #1f2a3a;
  --anatomy-mid: #6f7e94;
  --anatomy-lo: #a6b2c3;
  --anatomy-faint: #cad3df;
  --anatomy-lit: #0b1322;
  --anatomy-halo: #5d7594;
  --anatomy-halo-opacity: 0.26;
  --anatomy-dot: #2a3546;
  --rv-signal: #ff8f4d;
}

  --anatomy-paper: #c3cedb;

  --anatomy-top: #d0d9e4;
  --anatomy-shade-0: #a5b3c4;
  --anatomy-shade-1: #b0bdcc;
  --anatomy-shade-2: #bac6d3;
  --anatomy-shade-3: #c5cfdb;
  --anatomy-mid: #4f5e74;
  --anatomy-lo: #7d8ba0;
  --anatomy-faint: #9ba8b9;
}
.rv-figure .mat-rubber { --anatomy-paper: #b7c3d1; --anatomy-shade-0: #98a7ba; --anatomy-shade-1: #a3b1c2; --anatomy-shade-2: #aebbca; --anatomy-shade-3: #b9c5d2; }
/* yellow plastic (gear motors, hubs, mecanum wheels): a warm paper */

  --anatomy-shade-0: #e4d3b4;

}

  --anatomy-paper: #d4e2f1;
  --anatomy-top: #dde9f5;
  --anatomy-shade-0: #b9cce2;
  --anatomy-shade-1: #c3d4e7;
  --anatomy-shade-2: #ccdbec;
  --anatomy-shade-3: #d5e2f0;
}
.rv-figure .mat-blue {

  --anatomy-top: #c7daef;

  --anatomy-shade-1: #a5c1e1;
  --anatomy-shade-2: #b0c9e6;
  --anatomy-shade-3: #bbd1ea;
}
.rv-figure .mat-cell { --anatomy-paper: #e8eef5; --anatomy-shade-0: #cbd6e3; --anatomy-shade-1: #d4dee9; --anatomy-shade-2: #dde5ee; --anatomy-shade-3: #e6ecf3; }
.rv-figure .mat-wood {
  --anatomy-paper: #c9d1db;

.rv-figure .sight-line { fill: none; stroke: var(--rv-signal); stroke-width: 0.6; stroke-dasharray: 1.6 2.2; opacity: 0.7; }

  --anatomy-shade-0: #e6c9b8;
  --anatomy-shade-1: #ecd4c6;
  --anatomy-shade-2: #f1ddd1;
  --anatomy-shade-3: #f5e4da;
  --anatomy-lo: #c9a491;
  --anatomy-faint: #e0c3b3;

}

  --anatomy-shade-0: #dbe4ee;
}
.rv-figure .ph-wall { fill: var(--anatomy-shade-1); }

.rv-figure .ph-water { fill: none; stroke: #9cc3ea; stroke-width: 3.2; stroke-linecap: butt; }
.rv-figure .ph-wifi { fill: none; stroke: var(--anatomy-mid); stroke-width: 0.8; stroke-linecap: round; }
.rv-figure .ph-led { fill: #3d7bd9; stroke: #ffffff; stroke-width: 0.4; }
.rv-figure .ph-lock { opacity: 0.45; stroke-width: 0.8; }
/* Fig 8: the OLED's glass is the one dark face (its pixels a pale blue); the RGB LED takes the master's
   level: green, yellow, red, in the palette's soft tints; the lighter's gas is a cool grey */
.rv-figure .mat-glass {
  --anatomy-paper: #253042;
  --anatomy-top: #2e3a4e;
  --anatomy-shade-0: #1b2433;
  --anatomy-shade-1: #202a3a;
  --anatomy-shade-2: #253042;
  --anatomy-shade-3: #2a3548;
  --anatomy-lo: #3b4a61;

}
.rv-figure [data-oled] { fill: #d6e8ff; }
.rv-figure [data-rgb] { --anatomy-paper: #eef2f6; --anatomy-top: #f7f9fb; --anatomy-shade-0: #d5dde6; --anatomy-shade-1: #dde4eb; --anatomy-shade-2: #e5eaf0; --anatomy-shade-3: #edf1f5; }
.rv-figure [data-rgb="0"] { --anatomy-paper: #c9ecd5; --anatomy-top: #dcf4e4; --anatomy-shade-0: #9fd9b4; --anatomy-shade-1: #addfbf; --anatomy-shade-2: #bbe5ca; --anatomy-shade-3: #c6ead2; }
.rv-figure [data-rgb="1"] { --anatomy-paper: #ffd98a; --anatomy-top: #ffe9b8; --anatomy-shade-0: #f2b74c; --anatomy-shade-1: #f6c463; --anatomy-shade-2: #fad077; --anatomy-shade-3: #fdd885; }
.rv-figure [data-rgb="2"] { --anatomy-paper: #ffa98f; --anatomy-top: #ffc4b2; --anatomy-shade-0: #ef7455; --anatomy-shade-1: #f4866a; --anatomy-shade-2: #f8977d; --anatomy-shade-3: #fca38b; }

.rv-figure .fn-gas { fill: #a9b6c7; stroke: none; }

  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];

/**
 * What the master's OLED shows: one of the firmware's screens as text runs at (x, y) in panel pixels,
 * `size` 1 or 2, and the rules under the titles. `screen` 0 is the summary, 1 the node's detail, 2 the alert.
 */
function screenOf(screen, { smoke, level }) {
  const y = (v) => v + OLED_TOP;
  if (screen === 0) {
    return { text: [[0, y(0), 1, "FIRE MONITOR"], [0, y(16), 1, "Nodes : 1/1"], [0, y(28), 1, "AP IP : 192.168.4.1"], [0, y(42), 2, LEVELS[level]]], rules: [y(10)] };
  }
  if (screen === 1) {
    return {
      text: [[0, y(0), 1, "NODE: NODE_01"], [0, y(15), 1, `Smoke : ${smoke}`], [0, y(27), 1, `Temp  : ${AIR.temp.toFixed(1)} C`], [0, y(39), 1, `Humid : ${AIR.hum} %`], [0, y(51), 1, `State : ${LEVELS[level]}`]],
      rules: [y(10)],
    };
  }
  if (level === 0) return { text: [[0, y(0), 1, "All clear."], [0, y(16), 1, "No active alerts."]], rules: [] };
  return { text: [[0, y(6), 2, level === 2 ? "!! FIRE" : "WARNING"], [0, y(40), 1, "NODE_01"]], rules: [] };
}

/** A screen's lit pixels as runs [x, y, length] along each pixel row (the panel is 128 × 64). */
function pixelsOf({ text, rules }) {
  const lit = new Uint8Array(128 * 64);
  const set = (x, y) => { if (x >= 0 && x < 128 && y >= 0 && y < 64) lit[y * 128 + x] = 1; };
  for (const [x0, y0, size, s] of text) {
    [...s].forEach((ch, n) => {
      const rows = (GLYPHS[ch] ?? GLYPHS[" "]).split("|");
      rows.forEach((row, ry) => [...row].forEach((c, rx) => {
        if (c !== "#") return;
        for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) set(x0 + n * 6 * size + rx * size + i, y0 + ry * size + j);
      }));
    });
  }
  for (const ry of rules) for (let x = 0; x < 128; x++) set(x, ry);
  const runs = [];
  for (let y = 0; y < 64; y++) {
    for (let x = 0; x < 128; x++) {
      if (!lit[y * 128 + x]) continue;
      let n = 1;
      while (x + n < 128 && lit[y * 128 + x + n]) n++;
      runs.push([x, y, n]);
      x += n;
    }
  }
  return runs;
}

const Wh = (() => {// Wheels for the small rovers, shared by the build and the live pages (it takes the kit as
// arguments). A wheel's axis is `F.a` (along y), its outer face at s = +w2.

/** A TT wheel's rubber tyre: rounded shoulders on a flat tread band. */
const ttProfile = (r, w2) => [[-w2, r - 3.4], [-w2 + 2.2, r], [w2 - 2.2, r], [w2, r - 3.4]];
/** A mecanum wheel: two side plates and the band of rollers between them. */
const mecanumProfile = (r, w2) => [[-w2, r - 5], [-w2 + 2.6, r], [w2 - 2.6, r], [w2, r - 5]];

/**
 * What turns: a TT tyre's chevron lugs, or a mecanum wheel's rollers (diagonal at 45°). Every line
 * ends on a seam at the shoulder or meets its partner at the crown, and fades toward the limbs.
 * `hand` (+1 or -1) mirrors a mecanum wheel's rollers: the front and back pairs are opposite hands.
 */
function surface(k, G, P, F, kind, r, w2, turn, hand = 1) {
  if (kind === "tt") {
    const edge = w2 - 2.2;
    const lean = 0.14;
    const half = (s0, s1, phase, twist, seams) => G.ribsOf(F, s0, s1, r, 24, P, { phase, twist, fade: [0.12, 0.5], seams });
    return k.fadedSvg([...half(-edge, 0, turn, lean, "first"), ...half(0, edge, turn + lean, -lean, "last")], { tone: "lo" });
  }
  const edge = w2 - 2.6;
  return k.fadedSvg(G.ribsOf(F, -edge, edge, r, 9, P, { phase: turn, twist: 0.62 * hand, fade: [0.12, 0.5], seams: true }), { tone: "mid" });
}

/** The face you see: a TT wheel's yellow spoked hub, or a mecanum wheel's side plate and hub; `inner` for the inboard face. */
function hub(k, G, P, F, kind, r, w2, inner = false) {
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const D = (points, style) => k.dotsSvg(points, style);
  const at = (p) => k.iso(p, P);
  if (kind === "tt") {
    if (inner) return "";
    const rim = r - 7;
    const disc = G.disc(w2 - 3, w2 - 0.6, rim, F, P);
    const spokes = [];
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.3;
      spokes.push(k.pathOf([at(G.pointOf(F, w2 - 0.6, 6, a)), at(G.pointOf(F, w2 - 0.6, rim - 3.4, a))]));
    }
    return `<g class="mat-yellow">${S(disc, { tone: "mid" })}${L(G.circleOf(F, w2 - 0.6, rim - 3.4, P) + G.circleOf(F, w2 - 0.6, 6, P), { tone: "lo" })}${L(spokes.join(""), { tone: "lo" })}</g>` + D([at(G.pointOf(F, w2 - 0.6, 0, 0))], { size: 0.9, tone: "mid" });
  }
  if (inner) {
    // seen from inboard: only the far side plate and its screws
    const back = G.disc(-w2, -w2 + 2.6, r - 6, F, P);
    return `<g class="mat-yellow">${S(back, { tone: "mid" })}</g>` + D(G.dotsOf(F, -w2, r - 10, 6, P, { all: true }), { size: 0.5, tone: "mid" });
  }
  const plate = G.disc(w2 - 2.6, w2, r - 6, F, P);
  const boss = G.disc(w2, w2 + 2, 7, F, P);
  const screws = D(G.dotsOf(F, w2, r - 10, 6, P, { all: true }), { size: 0.5, tone: "mid" });
  return `<g class="mat-yellow">${S(plate, { tone: "mid" })}</g>${screws}<g class="mat-dark">${S(boss, { tone: "mid" })}</g>`;
}

return { ttProfile, mecanumProfile, surface, hub };})();

const Live = (() => {// The three small rovers, live (Figs 3–5). Each mount takes the stage holding the figure's <svg>, the
// kit (k, G), its model (M), the wheel drawer (W) and the build's data, and returns a stop function.
// Motion runs only while the figure is on screen; with reduced motion every change lands at once.

/** A critically damped spring toward `target`; false once it has settled. */
function settle(s, target, dt, seconds, calm, top = Infinity) {
  if (calm) { s.x = target; s.v = 0; return false; }
  const w = 1 / seconds;
  for (let i = 0; i < 4; i++) {
    s.v += (w * w * (target - s.x) - 2 * w * s.v) * (dt / 4);
    s.v = Math.max(-top, Math.min(top, s.v));
    s.x += s.v * (dt / 4);
  }
  if (Math.abs(target - s.x) < 0.05 && Math.abs(s.v) < 0.05) { s.x = target; s.v = 0; return false; }
  return true;
}

/** The frame loop every rover shares: `step(dt, calm)` returns true while anything still moves. */
function loopOf(stage, step) {
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  let visible = false;
  let frame = 0;
  let last = 0;
  const tick = (now) => {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
    last = now;
    const moving = step(dt, still.matches);
    frame = visible && moving && !still.matches ? requestAnimationFrame(tick) : 0;
  };
  const run = () => {
    if (still.matches) { step(0, true); return; }
    if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
  };
  const io = new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" });
  io.observe(stage);
  still.addEventListener?.("change", run);
  return { run, still, stop: () => { io.disconnect(); cancelAnimationFrame(frame); still.removeEventListener?.("change", run); } };
}

/** Where the pointer is across the drawing, 0 at its left edge to 1 at its right. */
const shareOf = (svg, event, inset = 0.12) => {
  const box = svg.getBoundingClientRect();
  return Math.min(1, Math.max(0, ((event.clientX - box.left) / box.width - inset) / (1 - inset * 2)));
};

/** Redraws a wheel's tread or rollers only when its turn has changed. */
function wheelsOf(svg, { k, G, W, data }) {
  const P = data.P;
  return data.wheels.map((wh) => {
    const el = svg.querySelector(`[data-wheel="${wh.name}"]`);
    let drawn = 0;
    return {
      ...wh,
      turn(phase) {
        if (!el || Math.abs(phase - drawn) < 0.004) return;
        el.innerHTML = W.surface(k, G, P, wh.F, wh.kind, wh.r, wh.w2, phase, wh.hand ?? 1);
        drawn = phase;
      },
    };
  });
}

// ---------------------------------------------------------------- Fig 3, the face tracker
/**
 * Traffic-sign mode: the sign rides its rail under the pointer, and the rover strafes sideways on its
 * mecanum wheels, with a lag, to keep the sign centred in front of the MU sensor.
 *
 * @param {HTMLElement} stage the element holding the figure's <svg>
 * @param {{ k: any, G: any, M: any, W: any, data: any, say?: (text: string) => void, describe?: (text: string) => void }} opts
 * @returns {() => void} stops the figure
 */
function mountFaceTracker(stage, { k, G, M, W, data, say = (text) => void text, describe = (text) => void text }) {
  const svg = stage.querySelector("svg");
  const P = data.P;
  const signG = svg.querySelector("[data-sign]");
  const roverG = svg.querySelector("[data-rover]");
  const sight = svg.querySelector("[data-sight]");
  const wheels = wheelsOf(svg, { k, G, W, data });
  // strafing, one diagonal pair of wheels turns one way and the other pair the other way
  const spin = { wheelLf: 1, wheelRb: 1, wheelRf: -1, wheelLb: -1 };
  const face = M.RAIL.x + M.RAIL.w / 2 + 3.4;

  const sign = { x: 0, v: 0 };
  const rover = { x: 0, v: 0 };
  let want = 0;
  let steering = false;
  let idle = 0;
  let clock = 0;
  const TOUR = [-58, 46, -22, 78, 0];

  const at = (p) => k.iso(p, P);
  const corner = (y, z, dy, dz, arm) => k.pathOf([at([face, y, z + dz * arm]), at([face, y, z]), at([face, y + dy * arm, z])]);
  function draw() {
    signG.setAttribute("transform", k.translateAlong(P, [0, sign.x, 0]));
    roverG.setAttribute("transform", k.translateAlong(P, [0, rover.x, 0]));
    for (const wh of wheels) wh.turn(((spin[wh.name] ?? 1) * Math.sign(wh.F.a[1]) * rover.x) / wh.r);
    // the focus box closes on the sign as the rover centres it
    const err = sign.x - rover.x;
    const h = M.SIGN.r + 4 + Math.min(10, Math.abs(err) * 0.25);
    const z = M.SIGN.z;
    const y = sign.x;
    const lens = [M.LENS[0], M.LENS[1] + rover.x, M.LENS[2]];
    sight.innerHTML =
      `<path class="sight-line" d="${k.pathOf([at(lens), at([face, y, z])])}"/>` +
      `<path class="sight-mark" d="${[corner(y - h, z - h, 1, 1, 6), corner(y + h, z - h, -1, 1, 6), corner(y - h, z + h, 1, -1, 6), corner(y + h, z + h, -1, -1, 6)].join("")}"/>`;
    say(readout(err));
  }
  function readout(err) {
    const n = Math.round(Math.abs(err));
    if (n < 3) return "sign · centred";
    // on screen, and so to the rover as you look over its back, -y is its right
    const side = err < 0 ? "right" : "left";
    const stuck = Math.abs(rover.x) > M.STRAFE - 0.5 && Math.abs(sign.x) > M.STRAFE && Math.abs(rover.v) < 1;
    return `sign · ${n} mm ${side} · ${stuck ? "end of travel" : "strafing"}`;
  }

  const loop = loopOf(stage, (dt, calm) => {
    if (!steering) {
      clock += dt;
      want = TOUR[Math.floor(clock / 2.8) % TOUR.length];
    } else if ((idle += dt) > 3.2) {
      steering = false;
      clock = 0;
    }
    const a = settle(sign, want, dt, 0.16, calm);
    const b = settle(rover, Math.max(-M.STRAFE, Math.min(M.STRAFE, sign.x)), dt, 0.34, calm, 150);
    draw();
    // the tour keeps the loop going until the pointer has been away a while
    return a || b || !steering || idle < 3.2;
  });
  const aim = (y, why) => {
    want = Math.max(-M.SIGN_RANGE, Math.min(M.SIGN_RANGE, y));
    steering = true;
    idle = 0;
    if (why) describe(why);
    loop.run();
  };
  // screen right is -y on this bench
  const fromPointer = (event) => aim(M.SIGN_RANGE * (1 - 2 * shareOf(svg, event)));
  const onMove = (event) => { if (event.pointerType === "mouse") fromPointer(event); };
  const onDown = (event) => { if (event.pointerType !== "mouse") fromPointer(event); };
  const onLeave = () => { idle = 2.2; };
  const onKey = (event) => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    aim((steering ? want : sign.x) + (event.key === "ArrowLeft" ? 20 : -20), "The sign moves; the rover strafes to keep it centred.");
  };
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointerleave", onLeave);
  stage.addEventListener("keydown", onKey);
  draw();
  return () => {
    loop.stop();
    stage.removeEventListener("pointermove", onMove);
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("pointerleave", onLeave);
    stage.removeEventListener("keydown", onKey);
  };
}

// ---------------------------------------------------------------- Fig 4, the obstacle car
/**
 * The car on its stand runs its loop: drive while the way ahead is clear; when the wall is closer than
 * STOP, stop, turn the sensor left and right, then turn the wheels toward the side with more room.
 * The wall rides its rail under the pointer.
 *
 * @param {HTMLElement} stage the element holding the figure's <svg>
 * @param {{ k: any, G: any, M: any, W: any, data: any, say?: (text: string) => void, describe?: (text: string) => void }} opts
 * @returns {() => void} stops the figure
 */
function mountObstacleCar(stage, { k, G, M, W, data, say = (text) => void text, describe = (text) => void text }) {
  const svg = stage.querySelector("svg");
  const P = data.P;
  const headG = svg.querySelector("[data-head]");
  const sonarG = svg.querySelector("[data-sonar]");
  const wallG = svg.querySelector("[data-wall]");
  const wheels = wheelsOf(svg, { k, G, W, data });
  const at = (p) => k.iso(p, P);

  const wall = { x: 42, v: 0 };
  const head = { x: 0, v: 0 }; // degrees toward the car's left
  const speed = { L: { x: 0, v: 0 }, R: { x: 0, v: 0 } }; // each side's tyre speed, mm/s
  const roll = { L: 0, R: 0 };
  let want = 42;
  let steering = false;
  let idle = 0;
  let tourAt = 0;
  let tourT = 0;
  const TOUR = [[42, 5.2], [91, 3.4], [-42, 5.2], [0, 5.2], [-91, 3.4]];
  // the loop: "drive", "look" (through LOOKS), "turn", "pause"
  let mode = "drive";
  let modeT = 0;
  let look = 0;
  let held = 0;
  let seen = {};
  let choice = "";
  let ping = 0;
  const LOOKS = [["ahead", 0, 0.35], ["left", M.LOOK, 0.5], ["right", -M.LOOK, 0.5], ["", 0, 0.15]];
  const DRIVE = 220;

  const mm = (d) => (d >= M.RANGE ? "clear" : `${Math.round(d)} mm`);
  const ahead = () => M.rangeAt(0, wall.x);
  function readout() {
    if (mode === "drive") return `ahead ${mm(ahead())} · driving`;
    const part = (key) => (key in seen ? mm(seen[key]) : "…");
    const line = `left ${part("left")} · ahead ${part("ahead")} · right ${part("right")}`;
    return choice ? `${line} → ${choice}` : line;
  }

  let drawnHead = NaN;
  function draw(calm) {
    wallG.setAttribute("transform", k.translateAlong(P, [0, wall.x, 0]));
    if (!(Math.abs(head.x - drawnHead) <= 0.05)) {
      headG.innerHTML = M.headOf(k, G, P, head.x).map((p) => M.pieceSvgOf(k, p)).join("");
      drawnHead = head.x;
    }
    for (const wh of wheels) wh.turn(wh.F.a[1] < 0 ? roll.L : roll.R);
    // the sonar cone, to the echo or fading out when nothing answers
    const d = M.rangeAt(head.x, wall.x);
    const reach = d >= M.RANGE ? 96 : Math.min(d, 150);
    const { o } = M.eyeOf(head.x);
    const arc = (r, from, to, n = 12) => Array.from({ length: n + 1 }, (_, i) => {
      const a = ((head.x + from + ((to - from) * i) / n) * Math.PI) / 180;
      return at([o[0] + Math.cos(a) * r, o[1] - Math.sin(a) * r, o[2]]);
    });
    const fan = [at(o), ...arc(reach, -M.CONE, M.CONE)];
    let out = `<path class="sonar"${d >= M.RANGE ? ' data-clear=""' : ""} d="${k.pathOf(fan, true)}"/>`;
    if (!calm) out += `<path class="sonar-arc" d="${k.pathOf(arc(reach * ping, -M.CONE * 0.9, M.CONE * 0.9, 8))}"/>`;
    if (d < M.RANGE) out += `<path class="sight-mark" d="${k.pathOf(arc(reach, -M.CONE, M.CONE))}"/>`;
    sonarG.innerHTML = out;
    say(readout());
  }

  function setMode(next) { mode = next; modeT = 0; }
  function think(dt, calm) {
    if (calm) {
      // without motion: one full reading, laid out at once
      const a = ahead();
      head.x = 0;
      if (a < M.STOP) {
        seen = { ahead: a, left: M.rangeAt(M.LOOK, wall.x), right: M.rangeAt(-M.LOOK, wall.x) };
        choice = seen.left > seen.right ? "left" : "right";
        mode = "turn";
      } else { seen = {}; choice = ""; mode = "drive"; }
      return;
    }
    modeT += dt;
    let vl = 0;
    let vr = 0;
    let aim = 0;
    if (mode === "drive") {
      vl = vr = DRIVE;
      if (ahead() < M.STOP) { setMode("look"); look = 0; held = 0; seen = {}; choice = ""; describe(`Wall ${mm(ahead())} ahead: the car stops and looks left and right.`); }
    } else if (mode === "look") {
      const [key, deg, hold] = LOOKS[look];
      aim = deg;
      // a reading is taken once the head has settled and held
      if (Math.abs(head.x - deg) < 0.5 && Math.abs(head.v) < 2) {
        held += dt;
        if (held > hold) {
          if (key) seen[key] = M.rangeAt(deg, wall.x);
          held = 0;
          look += 1;
          if (look >= LOOKS.length) {
            choice = seen.left > seen.right ? "left" : "right";
            describe(`Left ${mm(seen.left)}, right ${mm(seen.right)}: it turns ${choice}.`);
            setMode("turn");
          }
        }
      }
    } else if (mode === "turn") {
      // a turn on the spot: one side forward, the other back (the car's left is -y)
      vl = choice === "left" ? -DRIVE * 0.7 : DRIVE * 0.7;
      vr = -vl;
      if (modeT > 1.3) setMode("pause");
    } else if (mode === "pause") {
      if (modeT > 0.9) { setMode("drive"); seen = {}; choice = ""; }
    }
    settle(head, aim, dt, 0.09, false, 420);
    settle(speed.L, vl, dt, 0.12, false);
    settle(speed.R, vr, dt, 0.12, false);
    roll.L -= (speed.L.x * dt) / M.WHEEL.r;
    roll.R -= (speed.R.x * dt) / M.WHEEL.r;
    ping = (ping + dt * 2.6) % 1;
  }

  const loop = loopOf(stage, (dt, calm) => {
    if (!steering) {
      tourT += dt;
      if (tourT > TOUR[tourAt][1]) { tourT = 0; tourAt = (tourAt + 1) % TOUR.length; }
      want = TOUR[tourAt][0];
    } else if ((idle += dt) > 3.2) { steering = false; tourT = 0; }
    settle(wall, want, dt, 0.16, calm);
    think(dt, calm);
    draw(calm);
    return true;
  });
  const aim = (y) => {
    want = Math.max(-M.WALL_RANGE, Math.min(M.WALL_RANGE, y));
    steering = true;
    idle = 0;
    loop.run();
  };
  const fromPointer = (event) => aim(M.WALL_RANGE * (1 - 2 * shareOf(svg, event)));
  const onMove = (event) => { if (event.pointerType === "mouse") fromPointer(event); };
  const onDown = (event) => { if (event.pointerType !== "mouse") fromPointer(event); };
  const onLeave = () => { idle = 2.2; };
  const onKey = (event) => {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    aim((steering ? want : wall.x) + (event.key === "ArrowLeft" ? 20 : -20));
  };
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointerleave", onLeave);
  stage.addEventListener("keydown", onKey);
  think(0, loop.still.matches);
  draw(true);
  return () => {
    loop.stop();
    stage.removeEventListener("pointermove", onMove);
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("pointerleave", onLeave);
    stage.removeEventListener("keydown", onKey);
  };
}

// ---------------------------------------------------------------- Fig 5, the rescue vehicle
/**
 * Hover (or tap, or press Enter) and the drone spins up, lifts off the roof and flies out over the
 * bench while the arm behind the cabin unfolds; leave and both come back.
 *
 * @param {HTMLElement} stage the element holding the figure's <svg>
 * @param {{ k: any, G: any, M: any, W: any, data: any, say?: (text: string) => void, describe?: (text: string) => void }} opts
 * @returns {() => void} stops the figure
 */
function mountRescue(stage, { k, G, M, W, data, say = (text) => void text, describe = (text) => void text }) {
  void W;
  const svg = stage.querySelector("svg");
  const P = data.P;
  const droneG = svg.querySelector("[data-drone]");
  const propsG = svg.querySelector("[data-props]");
  const armG = svg.querySelector("[data-arm]");
  const trailG = svg.querySelector("[data-trail]");
  const at = (p) => k.iso(p, P);

  const fly = { x: 0, v: 0 };
  const arm = { x: 0, v: 0 };
  const rpm = { x: 0, v: 0 }; // propeller speed, 0..1
  let spin = 0;
  let active = false;
  let steering = false;
  let idle = 0;
  let clock = 0;
  const TOUR = [2.6, 6.4]; // seconds docked, then out

  let drawnArm = NaN;
  let drawnFly = NaN;
  function draw() {
    const off = M.flightOf(fly.x);
    if (fly.x !== drawnFly) {
      droneG.setAttribute("transform", k.translateAlong(P, off));
      // the way back to the pad, and the pad waiting for it
      if (fly.x > 0.03) {
        const path = Array.from({ length: 18 }, (_, i) => {
          const o = M.flightOf((fly.x * i) / 17);
          return at([M.DOCK[0] + o[0], M.DOCK[1] + o[1], M.DOCK[2] + 8 + o[2]]);
        });
        trailG.innerHTML = `<path class="sight-mark" d="${k.ring(M.DOCK[0], M.DOCK[1], 18, M.DOCK[2], P, 48)}"/><path class="sight-line" d="${k.pathOf(path)}"/>`;
      } else trailG.innerHTML = "";
      drawnFly = fly.x;
    }
    if (!(Math.abs(arm.x - drawnArm) <= 0.002)) {
      armG.innerHTML = M.armOf(k, G, P, arm.x).pieces.map((p) => M.pieceSvgOf(k, p)).join("");
      drawnArm = arm.x;
    }
    propsG.innerHTML = M.propsOf(k, G, P, spin, rpm.x * 0.55);
    say(readout(off));
  }
  function readout(off) {
    const armText = arm.x > 0.97 ? "arm out" : arm.x < 0.03 ? "arm folded" : "arm moving";
    if (fly.x < 0.01) return `drone docked · ${armText}`;
    return `drone · ${Math.round(off[2])} mm up · ${armText}`;
  }

  const loop = loopOf(stage, (dt, calm) => {
    if (!steering) {
      clock += dt;
      const period = TOUR[0] + TOUR[1];
      const want = clock % period > TOUR[0];
      if (want !== active) active = want;
    } else if ((idle += dt) > 3.2 && !active) { steering = false; clock = 0; }
    // the props spin up before lift-off and down only after landing
    const ready = rpm.x > 0.85;
    const r = settle(rpm, active || fly.x > 0.02 ? 1 : 0, dt, 0.22, calm);
    const f = settle(fly, active && (ready || calm) ? 1 : 0, dt, 0.7, calm, 0.9);
    const a = settle(arm, active ? 1 : 0, dt, 0.5, calm, 1.4);
    if (!calm) spin += rpm.x * dt * 38;
    draw();
    return r || f || a || rpm.x > 0 || !steering;
  });
  const set = (on) => {
    if (on !== active) describe(on ? "The drone lifts off and the arm unfolds." : "The drone lands on its pad and the arm folds.");
    active = on;
    steering = true;
    idle = 0;
    loop.run();
  };
  // a pointer already inside when the figure mounts never "enters", so moving counts too
  const onEnter = (event) => { if (event.pointerType === "mouse" && !(steering && active)) set(true); };
  const onLeave = (event) => { if (event.pointerType === "mouse") set(false); };
  const onDown = (event) => { if (event.pointerType !== "mouse") set(!active); };
  const onKey = (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    set(!active);
  };
  stage.addEventListener("pointerenter", onEnter);
  stage.addEventListener("pointermove", onEnter);
  stage.addEventListener("pointerleave", onLeave);
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("keydown", onKey);
  draw();
  return () => {
    loop.stop();
    stage.removeEventListener("pointerenter", onEnter);
    stage.removeEventListener("pointermove", onEnter);
    stage.removeEventListener("pointerleave", onLeave);
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("keydown", onKey);
  };
}

// ---------------------------------------------------------------- Fig 6, DementiaBot
/**
 * The person rides the rail under the pointer and the robot follows at its distance, a little behind,
 * with the camera's focus box on them. A click (or a tap on the robot, or Enter) is a medicine reminder:
 * the speaker sounds and the servo lifts the medicine box's lid, then lowers it.
 *
 * @param {HTMLElement} stage the element holding the figure's <svg>
 * @param {{ k: any, G: any, M: any, W: any, data: any, say?: (text: string) => void, describe?: (text: string) => void }} opts
 * @returns {() => void} stops the figure
 */
function mountDementiaBot(stage, { k, G, M, W, data, say = (text) => void text, describe = (text) => void text }) {
  const svg = stage.querySelector("svg");
  const P = data.P;
  const botG = svg.querySelector("[data-bot]");
  const lidG = svg.querySelector("[data-lid]");
  const voiceG = svg.querySelector("[data-voice]");
  const sightG = svg.querySelector("[data-sight]");
  const focusG = svg.querySelector("[data-focus]");
  const personG = svg.querySelector("[data-person]");
  const wheels = wheelsOf(svg, { k, G, W, data });
  const at = (p) => k.iso(p, P);
  const bumper = M.DECK.x + M.DECK.w;

  const person = { x: M.FOLLOW, v: 0 };
  const bot = { x: 0, v: 0 };
  const lid = { x: 0, v: 0 }; // the servo, degrees
  let want = M.FOLLOW;
  let steering = false;
  let idle = 0;
  let tourAt = 0;
  let tourT = 0;
  let fired = false;
  // a stop on the person's walk, how long it lasts, and whether a reminder falls due there
  const TOUR = [[200, 3.2, false], [286, 3.4, false], [286, 4.6, true], [166, 3.4, false], [244, 3.2, false]];
  let remind = -1; // seconds into a reminder, or -1
  let held = false; // reduced motion: the reminder stands until it is dismissed
  const REMIND = 4.2;

  function readout() {
    if (lid.x > M.OPEN * 0.8) return "medicine reminder · lid open";
    if (remind >= 0 || held) return "medicine reminder · speaking";
    if (lid.x > 1) return "lid closing";
    const gap = Math.round(person.x - bot.x - bumper - M.BASE.r);
    const err = person.x - M.FOLLOW - bot.x;
    const end = Math.abs(bot.x) > M.TRAVEL - 0.5 && Math.abs(person.x - M.FOLLOW) > M.TRAVEL && Math.abs(bot.v) < 1;
    if (end) return `person · ${gap} mm ahead · end of travel`;
    if (Math.abs(err) < 2) return `person · ${gap} mm ahead · holding`;
    return `person · ${gap} mm ahead · ${err > 0 ? "following" : "keeping distance"}`;
  }

  let drawnBot = NaN;
  let drawnPerson = NaN;
  let drawnLid = NaN;
  function draw(calm) {
    if (bot.x !== drawnBot) {
      botG.setAttribute("transform", k.translateAlong(P, [bot.x, 0, 0]));
      for (const wh of wheels) wh.turn(-bot.x / wh.r);
      drawnBot = bot.x;
    }
    if (person.x !== drawnPerson) {
      personG.setAttribute("transform", k.translateAlong(P, [person.x - M.FOLLOW, 0, 0]));
      drawnPerson = person.x;
    }
    if (!(Math.abs(lid.x - drawnLid) <= 0.05)) {
      lidG.innerHTML = M.lidOf(k, G, P, lid.x).map((p) => M.pieceSvgOf(k, p)).join("");
      drawnLid = lid.x;
    }
    // the voice: rings spreading off the speaker's top while it speaks
    const S = M.SPEAKER;
    const ringAt = (t, opacity) => `<path class="db-voice" style="opacity:${opacity.toFixed(3)}" d="${k.ring(S.x, S.y, S.r * (0.6 + t * 0.7), M.SPEAKER_TOP + 0.2, P, 64)}"/>`;
    let rings = "";
    if (held && calm) rings = ringAt(0.3, 0.6) + ringAt(0.65, 0.35);
    else if (remind >= 0) {
      const env = Math.min(1, remind / 0.25, (REMIND - 0.4 - remind) / 0.5);
      for (let i = 0; i < 3 && env > 0; i++) {
        const t = (remind * 0.9 + i / 3) % 1;
        rings += ringAt(t, env * (1 - t * t));
      }
    }
    voiceG.innerHTML = rings;
    // the camera's sight on the person, and its box closing as the robot catches up
    const err = person.x - M.FOLLOW - bot.x;
    const px = person.x;
    sightG.innerHTML = `<path class="sight-line" d="${k.pathOf([at([M.LENS[0] + bot.x, M.LENS[1], M.LENS[2]]), at([px, 0, M.PERSON_Z + 62])])}"/>`;
    const pad = 3 + Math.min(10, Math.abs(err) * 0.18);
    const y0 = -20 - pad;
    const y1 = 20 + pad;
    const z0 = M.PERSON_Z - 4 - pad;
    const z1 = M.HEAD.z + M.HEAD.r + pad;
    const corner = (y, z, dy, dz) => k.pathOf([at([px, y, z + dz * 11]), at([px, y, z]), at([px, y + dy * 9, z])]);
    focusG.innerHTML = `<path class="sight-mark" d="${[corner(y0, z0, 1, 1), corner(y1, z0, -1, 1), corner(y0, z1, 1, -1), corner(y1, z1, -1, -1)].join("")}"/>`;
    say(readout());
  }

  const loop = loopOf(stage, (dt, calm) => {
    if (!steering) {
      tourT += dt;
      const [x, hold, due] = TOUR[tourAt];
      want = x;
      // a reminder falls due once the robot has pulled up behind the person
      if (due && !fired && tourT > 1.4) { fired = true; if (remind < 0) remind = 0; }
      if (tourT > hold) { tourT = 0; tourAt = (tourAt + 1) % TOUR.length; fired = false; }
    } else if ((idle += dt) > 3.2 && remind < 0) { steering = false; tourT = 0; }
    settle(person, want, dt, 0.4, calm, 140);
    settle(bot, Math.max(-M.TRAVEL, Math.min(M.TRAVEL, person.x - M.FOLLOW)), dt, 0.22, calm, 200);
    if (remind >= 0) { remind += dt; if (remind > REMIND) remind = -1; }
    const open = calm ? held : remind >= 0.35 && remind < REMIND - 0.9;
    settle(lid, open ? M.OPEN : 0, dt, 0.14, calm, 280);
    draw(calm);
    return true;
  });
  const remindNow = () => {
    if (loop.still.matches) held = !held;
    else if (remind < 0) remind = 0;
    describe(held || remind >= 0 ? "Medicine reminder: the speaker sounds and the servo lifts the lid of the medicine box." : "The medicine box is closed.");
    loop.run();
  };
  const aim = (x) => {
    want = Math.max(M.PERSON.min, Math.min(M.PERSON.max, x));
    steering = true;
    idle = 0;
    loop.run();
  };
  // the bench runs left to right on screen; the person's walk spans the drawing's middle
  const fromPointer = (event) => aim(M.PERSON.min + (M.PERSON.max - M.PERSON.min) * shareOf(svg, event, 0.3));
  const onMove = (event) => { if (event.pointerType === "mouse") fromPointer(event); };
  // a click anywhere, or a tap on the robot's half, is a reminder; a tap ahead moves the person
  const onDown = (event) => {
    if (event.pointerType === "mouse" || shareOf(svg, event, 0) < 0.45) remindNow();
    else fromPointer(event);
  };
  const onLeave = () => { idle = 2.2; };
  const onKey = (event) => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); remindNow(); return; }
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    aim((steering ? want : person.x) + (event.key === "ArrowRight" ? 20 : -20));
    describe("The person moves; the robot follows at its distance.");
  };
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointerleave", onLeave);
  stage.addEventListener("keydown", onKey);
  draw(true);
  return () => {
    loop.stop();
    stage.removeEventListener("pointermove", onMove);
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("pointerleave", onLeave);
    stage.removeEventListener("keydown", onKey);
  };
}

// ---------------------------------------------------------------- Fig 7, Phulbari's pot
/**
 * The soil dries and the ESP32 reads the probe every so often. When a reading says dry it closes the
 * relay: the pump runs for five seconds, water runs down the tube into the pot and the soil darkens; then
 * the reading goes to Firebase. The peace lily droops as the soil dries and stands up again once watered.
 * A click (or a tap, or Enter) dries the soil at once.
 *
 * @param {HTMLElement} stage the element holding the figure's <svg>
 * @param {{ k: any, G: any, M: any, W: any, data: any, say?: (text: string) => void, describe?: (text: string) => void }} opts
 * @returns {() => void} stops the figure
 */
function mountPhulbari(stage, { k, G, M, W, data, say = (text) => void text, describe = (text) => void text }) {
  void W;
  const svg = stage.querySelector("svg");
  const P = data.P;
  const at = (p) => k.iso(p, P);
  const wetG = svg.querySelector("[data-wet]");
  const senseG = svg.querySelector("[data-sense]");
  const wifiG = svg.querySelector("[data-wifi]");
  const ledG = svg.querySelector("[data-led]");
  const pumpG = svg.querySelector("[data-pump]");
  const waters = [...svg.querySelectorAll("[data-water]")].map((el) => {
    const [a, b, run] = el.dataset.water.split(" ").map(Number);
    return { el, a, b, run, drawn: "" };
  });
  const leaves = M.LEAVES.map((spec, i) => ({ spec, el: svg.querySelector(`[data-leaf="${i}"]`), drawn: 0 }));
  const total = data.flow.total;
  const [ex, ey] = data.flow.end;
  const { o: ant, t: at0, g: ag } = data.antenna;
  const led = at(data.led);

  let m = M.MOIST.start; // the soil's moisture, percent
  let phase = "idle"; // idle → pump → drain → sync → idle
  let phaseT = 0;
  let readT = 0.6; // until the next reading
  let pulse = -1; // seconds since the last reading, while its ring spreads
  let hurry = false; // a click: the soil dries fast until a reading finds it dry
  let front = 0; // the water's leading edge along the tube, mm
  let tail = 0; // and its trailing edge
  const droop = { x: 0, v: 0 };
  let still = 0; // reduced motion: which still the figure shows (0 moist, 1 pumping, 2 watered)

  function readout() {
    const pc = `soil ${Math.round(m)}%`;
    if (phase === "pump") return front < total ? `${pc} · dry → pump on` : `${pc} · watering`;
    if (phase === "drain") return `${pc} · pump off`;
    if (phase === "sync") return `${pc} · sent to Firebase`;
    if (hurry) return `${pc} · drying`;
    return `${pc} · ${m < M.MOIST.dry ? "dry" : "moist"}`;
  }

  // in screen units: a dash scaled by pathLength fell short of the path's ends and left seams between chunks
  const dash = (from, to, run) => (to - from < 1e-3 ? `0 ${(run * 2).toFixed(1)}` : from <= 0 && to >= 1 ? "none" : `0 ${(from * run).toFixed(2)} ${((to - from) * run).toFixed(2)} ${(run * 2).toFixed(1)}`);
  let drawnWet = NaN;
  function draw(calm) {
    // the water in the tube, chunk by chunk
    for (const w of waters) {
      const span = w.b - w.a;
      const d = dash(Math.min(1, Math.max(0, (tail - w.a) / span)), Math.min(1, Math.max(0, (front - w.a) / span)), w.run);
      if (d !== w.drawn) { w.el.setAttribute("stroke-dasharray", d); w.drawn = d; }
    }
    // the wet patch round the tube's end
    const wet = Math.min(1, Math.max(0, (m - 24) / 40));
    if (!(Math.abs(wet - drawnWet) <= 0.004)) {
      wetG.innerHTML = wet > 0.01 ? `<path class="ph-wet" style="opacity:${(0.25 + 0.55 * wet).toFixed(3)}" d="${k.ring(ex, ey, 5 + 34 * wet, M.SOIL_Z, P, 48)}"/><path class="ph-wet" style="opacity:${(0.3 + 0.5 * wet).toFixed(3)}" d="${k.ring(ex, ey, 3 + 16 * wet, M.SOIL_Z, P, 40)}"/>` : "";
      drawnWet = wet;
    }
    // the leaves
    for (const leaf of leaves) {
      if (!leaf.el || Math.abs(droop.x - leaf.drawn) < 0.01) continue;
      leaf.el.innerHTML = M.leafSvgOf(k, G, P, M.leafOf(leaf.spec, droop.x).rows);
      leaf.drawn = droop.x;
    }
    // what the probe senses: a ring held on the soil round it, and one spreading at each reading
    const [px, py] = data.probe;
    let sense = `<path class="sight-mark ph-lock" d="${k.ring(px, py, 15, M.SOIL_Z, P, 48)}"/>`;
    if (pulse >= 0 && pulse < 0.9 && !calm) sense += `<path class="sight-mark" style="opacity:${(1 - pulse / 0.9).toFixed(3)}" d="${k.ring(px, py, 15 + 22 * pulse, M.SOIL_Z, P, 48)}"/>`;
    senseG.innerHTML = sense;
    // the relay's LED, lit while the relay is closed; the pump hums
    const on = phase === "pump";
    ledG.innerHTML = on ? `<circle class="ph-led" cx="${led[0].toFixed(1)}" cy="${led[1].toFixed(1)}" r="1.1"/>` : "";
    if (pumpG) pumpG.setAttribute("transform", on && !calm ? `translate(${(Math.sin(phaseT * 260) * 0.22).toFixed(2)} 0)` : "");
    // sending to Firebase: arcs off the antenna
    let arcs = "";
    if (phase === "sync") {
      for (let i = 0; i < 3; i++) {
        const t = calm ? 0.2 + i * 0.3 : (phaseT * 1.4 + i / 3) % 1;
        const r = 5 + 16 * t;
        const pts = [];
        for (let j = 0; j <= 12; j++) {
          const a = -0.7 + (1.4 * j) / 12;
          pts.push(at([0, 1, 2].map((n) => ant[n] + at0[n] * r * Math.cos(a) + ag[n] * r * Math.sin(a))));
        }
        const fade = calm ? 0.7 : Math.max(0, Math.min(1, phaseT / 0.3, (1.6 - phaseT) / 0.4)) * (1 - t);
        if (fade > 0.02) arcs += `<path class="ph-wifi" style="opacity:${fade.toFixed(3)}" d="${k.pathOf(pts)}"/>`;
      }
    }
    wifiG.innerHTML = arcs;
    say(readout());
  }

  function enter(next) { phase = next; phaseT = 0; }
  function read() {
    pulse = 0;
    readT = M.READ;
    if (phase === "idle" && m < M.MOIST.dry) {
      hurry = false;
      enter("pump");
      describe(`The soil reads ${Math.round(m)}%, dry: the relay closes and the pump waters the plant.`);
    }
  }

  const loop = loopOf(stage, (dt, calm) => {
    if (calm) {
      // without motion: three stills, laid out at once
      m = [M.MOIST.start, M.MOIST.dry - 1, 62][still];
      phase = ["idle", "pump", "sync"][still];
      front = still === 1 ? total : 0;
      tail = 0;
      droop.x = M.droopAt(m);
      draw(true);
      return false;
    }
    phaseT += dt;
    if (pulse >= 0) pulse += dt;
    if (phase === "idle") {
      m = Math.max(18, m - (hurry ? M.MOIST.fast : M.MOIST.rate) * dt);
      readT -= dt;
      if (readT <= 0 || (hurry && m < M.MOIST.dry - 1)) read();
    } else if (phase === "pump") {
      front = Math.min(total, front + M.FLOW * dt);
      if (front >= total) m = Math.min(70, m + M.MOIST.gain * dt);
      if (phaseT > M.WATER) enter("drain");
    } else if (phase === "drain") {
      tail = Math.min(front, tail + M.FLOW * dt);
      if (front >= total) m = Math.min(70, m + M.MOIST.gain * dt * (1 - tail / total));
      if (tail >= front) {
        front = 0;
        tail = 0;
        enter("sync");
        describe(`Watered: the soil reads ${Math.round(m)}%, and the reading goes to Firebase.`);
      }
    } else if (phase === "sync" && phaseT > 1.6) {
      enter("idle");
      readT = M.READ;
    }
    settle(droop, M.droopAt(m), dt, 0.5, false);
    draw(false);
    return true;
  });

    if (loop.still.matches) {
      still = (still + 1) % 3;
      describe(["The soil is moist; the pump is off.", "The soil reads dry: the relay closes and the pump waters the plant.", "Watered, and the reading goes to Firebase."][still]);
    } else if (phase === "idle") {
      hurry = true;
      describe("The soil dries.");
    }

  };

    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();

  };

  stage.addEventListener("keydown", onKey);

    loop.stop();
    stage.removeEventListener("pointerdown", dry);

// ---------------------------------------------------------------- Fig 8, the fire & smoke network
/**
 * The firmware's cycle, on the figure's clock (real seconds): the node sleeps 10 s, wakes, watches the
 * MQ-2 for 2 s and keeps the peak, sounds its own buzzer first if the peak is past a threshold, joins the
 * master's access point and sends the reading, then sleeps again. The master takes the worst level: its
 * RGB LED turns green, yellow or red, its buzzer chirps or sounds at the firmware's cadence, and its OLED
 * rotates through the firmware's three screens every 4 s. A click, a tap or Enter presses the lighter's
 * lever; on its own the tour presses it every few cycles, just before the node wakes.
 *
 * @param {HTMLElement} stage the element holding the figure's <svg>
 * @param {{ k: any, G: any, M: any, W: any, data: any, say?: (text: string) => void, describe?: (text: string) => void }} opts
 * @returns {() => void} stops the figure
 */
function mountFireNet(stage, { k, G, M, W, data, say = (text) => void text, describe = (text) => void text }) {
  void G;
  void W;
  const svg = stage.querySelector("svg");
  const P = data.P;
  const at = (p) => k.iso(p, P);
  const px = k.cameraOf(P).k; // screen px per mm
  const gasG = svg.querySelector("[data-gas]");
  const chirpG = svg.querySelector("[data-chirp]");
  const wifiG = svg.querySelector("[data-wifi]");
  const senseG = svg.querySelector("[data-sense]");
  const oledG = svg.querySelector("[data-oled]");
  const rgbEl = svg.querySelector("[data-rgb]");
  const glowG = svg.querySelector("[data-glow]");
  const leverEl = svg.querySelector("[data-lever]");
  const GLOW = ["#7fd09c", "#ffc35c", "#ff8a6b"];
  const LOW = ["normal", "warning", "critical"];

  let clock = 0;
  let phase = "sleep"; // sleep → watch → alarm → join → send → sleep
  let phaseT = 0;
  let sleepLeft = 3;
  let puff = Infinity; // seconds since the lever went down
  let wakes = 3; // wakes since the last puff: the tour presses the lever again after three
  let index = 6; // the MQ-2's smoke index
  let peak = 0;
  let level = 0;
  let sampleT = 0;
  let beeps = [];
  const master = { smoke: 6, level: 0, at: -99, beepT: 0 };
  let sentAt = -99; // when the node's request went out: its arcs, and the master's reply, linger a moment
  let screen = 0;
  let screenT = 0;
  let drawnOled = "";
  let still = 0; // reduced motion: which still (normal, warning, critical)
  let calmNow = false;

  function readout() {
    if (calmNow) return `smoke ${master.smoke} · ${LOW[master.level]}`;
    if (phase === "watch") return "node awake · reading MQ-2";
    if (phase === "alarm") return level === 2 ? `smoke ${peak} · node alarm` : `smoke ${peak} · node chirps`;
    if (phase === "join") return "joining FireDetector";
    if (phase === "send") return `smoke ${peak} → 192.168.4.1`;
    const wake = `wakes in ${Math.max(1, Math.ceil(sleepLeft))} s`;
    if (clock - master.at < 2.8) return `master · ${LOW[master.level]} · ${master.smoke}`;
    if (M.gasAt(puff) > 0.08) return `gas on the MQ-2 · ${wake}`;
    return `node asleep · ${wake}`;
  }

  const ringAt = (x, y, r, z, n = 40) => k.ring(x, y, r, z, P, n);
  function draw(calm) {
    const g = M.gasAt(puff);
    // the lighter's gas: a jet out of the nozzle while the lever is down, then a cloud settling over the cap
    let gas = "";
    if (g > 0.01) {
      const [nx, ny, nz] = data.nozzle;
      const { x: cx, y: cy, z: cz } = data.cap;
      if (puff < M.GAS.rise + M.GAS.hold) {
        for (let i = 0; i < 9; i++) {
          const s = (i + ((clock * 1.4) % 1)) / 9;
          const p = at([nx + (cx - nx) * s, ny + (cy - ny) * s + Math.sin(i * 2.1 + clock * 3) * s * 1.6, nz + (cz + 2 - nz) * s]);
          gas += `<circle class="fn-gas" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${((1.2 + 4.2 * s) * px).toFixed(2)}" fill-opacity="${(g * (0.46 - 0.26 * s)).toFixed(3)}"/>`;
        }
      }
      for (let i = 0; i < 6; i++) {
        const a = i * 1.047 + clock * 0.35;
        const r = 4 + 4.5 * (1 - g) + (i % 2) * 2.5;
        const p = at([cx + Math.cos(a) * r, cy + Math.sin(a) * r, cz + 1.5 + (i % 3)]);
        gas += `<circle class="fn-gas" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${((4.6 + (i % 3) * 1.2) * px).toFixed(2)}" fill-opacity="${(g * 0.3).toFixed(3)}"/>`;
      }
    }
    gasG.innerHTML = gas;
    if (leverEl) leverEl.setAttribute("transform", puff < M.GAS.rise + M.GAS.hold ? `translate(${data.lever[0].toFixed(2)} ${data.lever[1].toFixed(2)})` : "");
    // what the node senses: a ring held round the cap while it watches, one spreading each half second
    let sense = "";
    if (phase === "watch") {
      const { x, y, z } = data.cap;
      sense = `<path class="sight-mark ph-lock" d="${ringAt(x, y, 9.6, z, 48)}"/>`;
      const t = (phaseT % 0.5) / 0.5;
      if (!calm) sense += `<path class="sight-mark" style="opacity:${(1 - t).toFixed(3)}" d="${ringAt(x, y, 9.6 + 9 * t, z, 48)}"/>`;
    }
    senseG.innerHTML = sense;
    // the buzzers: rings off the top while each sounds
    let chirp = "";
    const ringsOff = (b, t) => {
      for (let i = 0; i < 2; i++) {
        const u = (t * 2.2 + i / 2) % 1;
        chirp += `<path class="fn-chirp" style="opacity:${(0.85 * (1 - u)).toFixed(3)}" d="${ringAt(b.x, b.y, 3 + 10 * u, b.z + 0.6, 36)}"/>`;
      }
    };
    if (phase === "alarm" && beeps.some(([t0, len]) => phaseT >= t0 && phaseT < t0 + len)) ringsOff(data.buzzers[0], phaseT);
    const beat = M.MASTER_BEEP[master.level];
    if (beat && master.beepT % (beat.on + beat.off) < beat.on && !calm) ringsOff(data.buzzers[1], master.beepT);
    chirpG.innerHTML = chirp;
    // WiFi: the node's request to the master, then the master's reply back
    let wifi = "";
    const arcs = (o, dir, t) => {
      for (let i = 0; i < 3; i++) {
        const u = calm ? 0.25 + i * 0.3 : (t * 2.4 + i / 3) % 1;
        const r = 3 + 17 * u;
        const pts = [];
        for (let j = 0; j <= 12; j++) {
          const a = -0.75 + (1.5 * j) / 12;
          pts.push(at([o[0] + dir * r * Math.cos(a), o[1], o[2] + r * Math.sin(a)]));
        }
        wifi += `<path class="fn-wifi" style="opacity:${(calm ? 0.7 : 1 - u).toFixed(3)}" d="${k.pathOf(pts)}"/>`;
      }
    };
    const sent = clock - sentAt;
    if ((sent >= 0 && sent < 1.1) || (calm && still > 0)) arcs(data.antennas[0], 1, sent);
    const replied = clock - master.at;
    if (replied >= 0 && replied < 1.1 && !calm) arcs(data.antennas[1], -1, replied);
    wifiG.innerHTML = wifi;
    // the master: its LED, the glow on the board under it, and the OLED's screen
    rgbEl.setAttribute("data-rgb", String(master.level));
    const [lx, ly] = data.led;
    glowG.innerHTML = `<path class="fn-glow" style="fill:${GLOW[master.level]};opacity:0.34" d="${ringAt(lx, ly, 5.2, M.BT + 0.01, 32)}"/>`;
    const key = `${screen}|${master.smoke}|${master.level}`;
    if (key !== drawnOled) {
      oledG.innerHTML = `<path d="${M.pixelsOf(M.screenOf(screen, master)).map(([x, y, n]) => `M${x} ${y}h${n}v1h${-n}z`).join("")}"/>`;
      drawnOled = key;
    }
    say(readout());
  }

  function lever() {
    puff = 0;
    wakes = 0;
    describe("The lighter's gas reaches the MQ-2.");
  }
  function enter(next) { phase = next; phaseT = 0; }
  const loop = loopOf(stage, (dt, calm) => {
    calmNow = calm;
    if (calm) {
      // without motion: three stills, normal, warning and critical
      const smoke = [6, 244, 812][still];
      peak = smoke;
      level = still;
      Object.assign(master, { smoke, level: still });
      phase = "sleep";
      sleepLeft = M.SLEEP;
      puff = still === 2 ? 1 : Infinity;
      screen = still;
      clock = 99;
      draw(true);
      return false;
    }
    clock += dt;
    phaseT += dt;
    puff += dt;
    master.beepT += dt;
    screenT += dt;
    if (screenT >= M.OLED_ROTATE) { screenT -= M.OLED_ROTATE; screen = (screen + 1) % 3; }
    index = M.sensorStep(index, M.gasAt(puff), dt);
    if (phase === "sleep") {
      sleepLeft -= dt;
      if (wakes >= 3 && sleepLeft < 2.3 && puff > 20) lever();
      if (sleepLeft <= 0) { enter("watch"); peak = 0; sampleT = 0; wakes++; }
    } else if (phase === "watch") {
      sampleT -= dt;
      if (sampleT <= 0) {
        sampleT = 0.066;
        peak = Math.max(peak, Math.round(Math.min(1000, Math.max(0, index + (Math.random() * 2 - 1) * M.MQ2.noise))));
      }
      if (phaseT >= M.WATCH) {
        level = M.levelOf(peak);
        beeps = M.NODE_BEEPS[level];
        enter(level ? "alarm" : "join");
        if (level) describe(`The node reads smoke ${peak}, ${LOW[level]}, and sounds its own buzzer before it calls the master.`);
      }
    } else if (phase === "alarm") {
      const last = beeps[beeps.length - 1];
      if (phaseT >= (last ? last[0] + last[1] + 0.2 : 0)) enter("join");
    } else if (phase === "join") {
      if (phaseT >= M.JOIN) { enter("send"); sentAt = clock; }
    } else if (phase === "send" && phaseT >= M.SEND) {
      if (master.level !== level) master.beepT = 0;
      Object.assign(master, { smoke: peak, level, at: clock });
      if (level === 2) describe("The master shows !! FIRE: its LED turns red and its buzzer sounds.");
      else if (level === 1) describe("The master shows a warning: its LED turns yellow and it chirps.");
      enter("sleep");
      sleepLeft = M.SLEEP;
    }
    draw(false);
    return true;
  });
  const press = () => {
    if (loop.still.matches) {
      still = (still + 1) % 3;
      describe(["Clean air: the master's LED is green.", "A whiff of gas: the node chirps and the master's LED turns yellow.", "The lighter's gas: the node sounds its alarm, the master shows !! FIRE and its LED turns red."][still]);
    } else if (puff > 1.8) lever();
    loop.run();
  };
  const onKey = (event) => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault();
    press();
  };
  stage.addEventListener("pointerdown", press);
  stage.addEventListener("keydown", onKey);
  draw(loop.still.matches);
  return () => {
    loop.stop();
    stage.removeEventListener("pointerdown", press);
    stage.removeEventListener("keydown", onKey);
  };
}
