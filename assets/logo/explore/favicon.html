<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Favicon Colours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--field:#b8d4f0;--hi:#eaf1f8;--ink:#121a26;--paper:#f5f8fb;--muted:#6b7686;--line:rgb(18 26 38 / .1)}
*{box-sizing:border-box}
body{margin:0;background:var(--hi);color:var(--ink);font:15px/1.55 'Rethink Sans',system-ui,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:56px 16px 96px}
.eyebrow{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0 0 16px}
header p{margin:0;max-width:64ch;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px;margin-top:40px}
.card{background:var(--paper);border-radius:28px;padding:20px;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:18px}
.top img{width:96px;height:96px}
.sizes{display:flex;align-items:flex-end;gap:14px}
h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.top p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.no{font:500 12px 'JetBrains Mono',monospace;color:var(--muted)}
.bar{display:flex;align-items:flex-end;height:42px;padding:0 10px;border-radius:12px;overflow:hidden}
.bar.light{background:#dee1e6}
.bar.dark{background:#202124}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px 9px 0 0;font:12px system-ui,sans-serif;white-space:nowrap;overflow:hidden;min-width:0}
.light .tab{background:#fff;color:#3c4043}
.dark .tab{background:#35363a;color:#e8eaed}
.tab.off{background:none;opacity:.8}
.tab img{width:16px;height:16px;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Ashish Gupta · Favicon colours</p>
    <h1>The A arm in the site palette</h1>
    <p>Same drawing as the current favicon, recoloured with the site's own tokens. Each card shows it large, at 48, 32 and 16 px, and as it sits in a light and a dark browser tab next to another site's tab.</p>
  </header>
  <main class="grid" id="grid"></main>
</div>
<script>
const V = [
  ['ink', 'Ink', 'Current: paper arm on ink'],
  ['sky', 'Sky', 'Ink arm on the hero sky blue'],
  ['sky-fade', 'Sky fade', 'Hero sky, pale at the top and deeper at the floor'],
  ['mist', 'Mist', 'Ink arm on the palest blue'],
  ['paper', 'Paper', 'Ink arm on paper with a sky-blue edge'],
  ['apricot', 'Apricot', 'Ink arm on apricot, sky-blue tip'],
  ['sky-arm', 'Sky arm', 'Sky-blue arm on ink, apricot tip'],
  ['adaptive', 'Adaptive', 'No tile: ink arm in light tabs, paper arm in dark tabs'],
];
const other = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#8a94a3"/></svg>');
const grid = document.getElementById('grid');
V.forEach(([k, name, note], i) => {
  const src = `favicons/${k}.svg`, dark = k === 'adaptive' ? 'favicons/adaptive-dark.svg' : src;
  const tabs = (s, theme) => `<div class="bar ${theme}"><div class="tab"><img src="${s}" alt="">Ashish Gupta | AI &amp; Robotics Engineer</div><div class="tab off"><img src="${other}" alt="">Inbox</div></div>`;
  grid.insertAdjacentHTML('beforeend', `<article class="card">
    <div class="top"><img src="${src}" alt="${name} favicon"><div><span class="no">0${i}</span><h2>${name}</h2><p>${note}</p></div></div>
    <div class="sizes">${[48, 32, 16].map(s => `<img src="${src}" width="${s}" height="${s}" alt="">`).join('')}</div>
    ${tabs(src, 'light')}${tabs(dark, 'dark')}
  </article>`);
});
</script>
</body>
</html>
